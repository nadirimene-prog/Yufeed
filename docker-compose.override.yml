services:
  # Override API service for local development
  api:
    environment:
      # Override database host to use Docker service name
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/yufeed
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ./apps/api:/app
      - /app/.venv
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: npm run dev -- --webpack --hostname 0.0.0.0
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/ws
      - API_INTERNAL_URL=http://api:8000
      - NODE_ENV=development
      - NEXT_DISABLE_TURBOPACK=1
