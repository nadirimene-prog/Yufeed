# Pre-commit hooks for the YuFeed monorepo
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Update:  pre-commit autoupdate

default_language_version:
  python: python3.12
  node: "22.12.0"

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── Python: Black formatter ───────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args:
          - --line-length=100
          - --target-version=py312
        files: ^apps/api/

  # ── Python: Flake8 linter ─────────────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,E402,E501,E712,E741,F401,F841
        files: ^apps/api/(src|tests)/.*\.py$

  # ── Python: mypy type checker ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --config-file=apps/api/mypy.ini
        files: ^apps/api/
        additional_dependencies:
          - pydantic>=2.0
          - fastapi>=0.115.0
          - sqlalchemy>=2.0

  # ── Secrets detection ─────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: >-
          (?x)^(
            .*\.lock$|
            .*package-lock\.json$|
            .*\.svg$
          )$

  # ── Frontend: ESLint ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: bash -lc 'cd apps/web && npx --no-install eslint src --max-warnings=0'
        language: system
        files: ^apps/web/src/.*\.(ts|tsx)$
        pass_filenames: false
        types: [file]

  # ── Frontend: Prettier ────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        entry: bash -lc 'cd apps/web && npx --no-install prettier --check --ignore-unknown src'
        language: system
        files: ^apps/web/src/.*\.(ts|tsx|css)$
        pass_filenames: false
        types: [file]
