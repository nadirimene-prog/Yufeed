global:
  resolve_timeout: 5m

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

# Receivers - for development, we just log alerts (no external webhooks)
receivers:
  - name: 'default'
    # No webhook configured - alerts are just stored in alertmanager

  - name: 'critical-alerts'
    # For production, configure email or Slack:
    # email_configs:
    #   - to: 'ops-team@example.com'
    #     smarthost: 'mailhog:1025'
    #     from: 'alertmanager@yufeed.local'
    #     require_tls: false
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-critical'

  - name: 'warning-alerts'
    # For production, configure email or Slack

# Inhibit rules - suppress warning when critical is active
inhibit_rules:
  - source_match:
        severity: 'critical'
    target_match:
        severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
