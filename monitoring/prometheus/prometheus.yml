global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'yufeed-dev'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # YuFeed API metrics (FastAPI + prometheus-fastapi-instrumentator)
  - job_name: 'yufeed-api'
    static_configs:
      - targets: ['yufeed-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Note: Redis and PostgreSQL don't expose Prometheus metrics natively.
  # To monitor them, you would need to add exporters:
  # - redis_exporter (https://github.com/oliver006/redis_exporter)
  # - postgres_exporter (https://github.com/prometheus-community/postgres_exporter)
